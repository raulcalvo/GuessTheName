<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ranking · Cómo se llamará</title>
<meta name="theme-color" content="#f7a8c4">
<link rel="icon" href="../icons/icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Pacifico&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/estilos.css">
<style>
  .ranking { list-style: none; padding: 0; margin: 0 0 8px; text-align: left; }
  .ranking li {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; margin-bottom: 8px;
    background: #fff; border-radius: 16px; border: 2px solid #f1e6f8;
  }
  .ranking li.podio-1 { border-color: #ffd36e; background: #fffaf0; }
  .ranking li.podio-2 { border-color: #d6d9e0; }
  .ranking li.podio-3 { border-color: #e8b98a; }
  .posicion { min-width: 2.2em; font-weight: 700; font-size: 1.2rem; text-align: center; }
  .quien { flex: 1; font-weight: 600; overflow-wrap: anywhere; }
  .cuantos { font-weight: 700; color: var(--boton); white-space: nowrap; }
  .pendientes li { opacity: 0.85; }
  .pendientes .cuantos { color: var(--texto-suave); }
  .vacio { color: var(--texto-suave); }
  h2.seccion { font-size: 1.3rem; margin: 24px 0 12px; }
  .sospechosos {
    margin-top: 24px; padding: 4px 14px 10px;
    border: 3px dashed #b9a6d9; border-radius: 20px; background: #f7f2ff;
  }
  .sospechosos .ranking li { border-color: #e2d6f5; flex-wrap: wrap; }
  .sospechosos .cuantos { color: #7a6cf0; }
  .rendidos {
    margin-top: 24px; padding: 4px 14px 10px;
    border: 3px dashed #c9c9c9; border-radius: 20px; background: #f4f4f4;
  }
  .rendidos .ranking li { border-color: #e2e2e2; flex-wrap: wrap; opacity: 0.9; }
  .rendidos .cuantos { color: var(--texto-suave); }
  .rendidos .motivo, .sospechosos .motivo { flex-basis: 100%; margin-left: calc(2.2em + 12px); font-size: 0.9rem; color: var(--texto-suave); }
  .volver { display: inline-block; margin-top: 16px; color: var(--boton); font-weight: 600; }
</style>
</head>
<body>
<nav class="idiomas" aria-label="Idioma / Language">
  <button type="button" data-idioma="es" lang="es">ES</button>
  <button type="button" data-idioma="ca" lang="ca">CA</button>
  <button type="button" data-idioma="en" lang="en">EN</button>
</nav>

<main>
  <section class="pantalla activa">
    <div class="globos" aria-hidden="true">🏆 👶 🏆</div>
    <h1 id="titulo">Ranking</h1>
    <p class="intro" id="intro"></p>
    <p id="estado" class="vacio"></p>
    <ol id="ganadores" class="ranking"></ol>
    <div id="bloque-sospechosos" class="sospechosos" hidden>
      <h2 id="titulo-sospechosos" class="seccion"></h2>
      <p id="intro-sospechosos" class="intro"></p>
      <ul id="sospechosos" class="ranking"></ul>
    </div>
    <h2 id="titulo-pendientes" class="seccion" hidden></h2>
    <ul id="pendientes" class="ranking pendientes"></ul>
    <div id="bloque-rendidos" class="rendidos" hidden>
      <h2 id="titulo-rendidos" class="seccion"></h2>
      <p id="intro-rendidos" class="intro"></p>
      <ul id="rendidos" class="ranking"></ul>
    </div>
    <a class="volver" id="volver" href="../">← </a>
  </section>
</main>

<script src="../js/i18n.js"></script>
<script type="module">
  // Importación tolerante: si el navegador aún tiene en caché una versión vieja
// de almacen.js, el ranking sigue cargando aunque falte algo nuevo.
  import * as almacen from "../js/almacen.js";
  const MAX_SOSPECHOSO = almacen.MAX_SOSPECHOSO || 3;

  const TEXTOS = {
    es: {
      titulo: "Ranking de oráculos",
      intro: "Quién ha adivinado el nombre con menos intentos. Los demás, abajo, siguen buscando la inspiración.",
      cargando: "Consultando el marcador...",
      nadie: "Todavía nadie lo ha adivinado. ¡El podio está libre!",
      pendientes: "Siguen intentándolo",
      rendidos: "🏳️ Tiraron la toalla",
      introRendidos: "Empezaron con mucha ilusión, probaron unos cuantos nombres y, a la primera dificultad, desaparecieron. Llevan más de una hora sin dar señales de vida. Son los auténticos perdedores de este juego.",
      motivosRendidos: [
        "Tiene la estantería llena de libros que no pasaron del capítulo dos.",
        "Seguro que también deja las series a mitad de temporada.",
        "Su gimnasio le sigue cobrando desde enero.",
        "Empezó con más ganas que nadie. Lo de terminar ya, si eso, otro día.",
        "Dijo «ahora vuelvo» y aquí seguimos esperando.",
        "Tiene un puzle de 1000 piezas con 12 colocadas desde 2019.",
        "Ni el bebé está tardando tanto en llegar.",
        "Abandonó antes que los propósitos de Año Nuevo."
      ],
      intento: "1 intento", intentos: "{n} intentos",
      leyendaPistas: "Quien no ha abierto pistas va por delante; 🔎 = pistas abiertas.",
      sinNube: "El ranking no está disponible ahora mismo. Revisa la conexión y vuelve a probar.",
      volver: "← Volver al juego",
      sospechosos: "🕵️ Bajo sospecha",
      introSospechosos: "Estos prodigios lo adivinaron en {max} intentos o menos. La organización no acusa a nadie, pero tampoco cree en las casualidades: quedan fuera del podio mientras dure la investigación.",
      motivos: [
        "Bajo acusación de haber cotilleado el móvil de los papás.",
        "Dice que fue intuición. Nadie le cree.",
        "Se le vio salir del registro civil silbando.",
        "Perfil habitual en los chivatazos familiares.",
        "Asegura que se lo dijo un pajarito. Investigamos al pajarito.",
        "Tiene más información que el propio bebé.",
        "Acertó tan rápido que ni le dio tiempo a disimular."
      ]
    },
    ca: {
      titulo: "Rànquing d'oracles",
      intro: "Qui ha endevinat el nom amb menys intents. La resta, a sota, continuen buscant la inspiració.",
      cargando: "Consultant el marcador...",
      nadie: "Encara ningú l'ha endevinat. El podi és lliure!",
      pendientes: "Continuen intentant-ho",
      rendidos: "🏳️ Van llençar la tovallola",
      introRendidos: "Van començar amb molta il·lusió, van provar uns quants noms i, a la primera dificultat, van desaparèixer. Fa més d'una hora que no donen senyals de vida. Són els autèntics perdedors d'aquest joc.",
      motivosRendidos: [
        "Té la prestatgeria plena de llibres que no van passar del capítol dos.",
        "Segur que també deixa les sèries a mitja temporada.",
        "El gimnàs encara li cobra des de gener.",
        "Va començar amb més ganes que ningú. Acabar ja, si de cas, un altre dia.",
        "Va dir «ara torno» i aquí seguim esperant.",
        "Té un trencaclosques de 1000 peces amb 12 posades des del 2019.",
        "Ni el nadó està trigant tant a arribar.",
        "Ha abandonat abans que els propòsits d'Any Nou."
      ],
      intento: "1 intent", intentos: "{n} intents",
      leyendaPistas: "Qui no ha obert pistes va per davant; 🔎 = pistes obertes.",
      sinNube: "El rànquing no està disponible ara mateix. Revisa la connexió i torna-ho a provar.",
      volver: "← Torna al joc",
      sospechosos: "🕵️ Sota sospita",
      introSospechosos: "Aquests prodigis ho van endevinar en {max} intents o menys. L'organització no acusa ningú, però tampoc no creu en les casualitats: queden fora del podi mentre duri la investigació.",
      motivos: [
        "Sota acusació d'haver xafardejat el mòbil dels pares.",
        "Diu que va ser intuïció. Ningú no s'ho creu.",
        "El van veure sortir del registre civil xiulant.",
        "Perfil habitual en les xivatades familiars.",
        "Assegura que li ho va dir un ocellet. Investiguem l'ocellet.",
        "Té més informació que el mateix nadó.",
        "Ho va encertar tan ràpid que ni va tenir temps de dissimular."
      ]
    },
    en: {
      titulo: "Oracle leaderboard",
      intro: "Who guessed the name in the fewest attempts. Everyone else, below, is still looking for inspiration.",
      cargando: "Checking the scoreboard...",
      nadie: "Nobody has guessed it yet. The podium is up for grabs!",
      pendientes: "Still trying",
      rendidos: "🏳️ Threw in the towel",
      introRendidos: "They started full of enthusiasm, tried a few names and vanished at the first hurdle. Not a sign of life for over an hour. These are the true losers of this game.",
      motivosRendidos: [
        "Their bookshelf is full of books that never made it past chapter two.",
        "Bet they quit TV series halfway through the season too.",
        "Their gym has been charging them since January.",
        "Started keener than anyone. Finishing? Maybe some other day.",
        "Said \"back in a sec\" and we're still waiting.",
        "Has had a 1000-piece puzzle with 12 pieces in place since 2019.",
        "Even the baby is taking less time to arrive.",
        "Gave up faster than a New Year's resolution."
      ],
      intento: "1 attempt", intentos: "{n} attempts",
      leyendaPistas: "Players who opened no clues rank first; 🔎 = clues opened.",
      sinNube: "The leaderboard isn't available right now. Check your connection and try again.",
      volver: "← Back to the game",
      sospechosos: "🕵️ Under suspicion",
      introSospechosos: "These prodigies got it in {max} attempts or fewer. The organisers accuse no one, but they don't believe in coincidences either: they stay off the podium while the investigation continues.",
      motivos: [
        "Accused of snooping on the parents' phone.",
        "Claims it was intuition. Nobody believes it.",
        "Seen leaving the registry office, whistling.",
        "A usual suspect in family leaks.",
        "Says a little bird told them. We're questioning the bird.",
        "Knows more than the baby does.",
        "Guessed so fast they forgot to act surprised."
      ]
    }
  };

  let idioma = detectarIdioma();
  let T = TEXTOS[idioma] || TEXTOS.es;
  const $ = (id) => document.getElementById(id);
  const medallas = ["🥇", "🥈", "🥉"];
  const veces = (n) => (n === 1 ? T.intento : T.intentos.replace("{n}", n));

  function fila(lista, posicion, nombre, n, icono, pistas) {
    const li = document.createElement("li");
    if (posicion && posicion <= 3) li.className = "podio-" + posicion;
    const pos = document.createElement("span");
    pos.className = "posicion";
    pos.textContent = posicion ? (medallas[posicion - 1] || posicion + "º") : (icono || "·");
    const quien = document.createElement("span");
    quien.className = "quien";
    quien.textContent = nombre;
    const cuantos = document.createElement("span");
    cuantos.className = "cuantos";
    cuantos.textContent = veces(n) + (pistas ? ` · 🔎${pistas}` : "");
    li.append(pos, quien, cuantos);
    lista.append(li);
  }

  const HORA_RENDIDO = 60 * 60 * 1000;

  // Siempre la misma frase para la misma persona.
  function motivo(lista, j, frases) {
    const semilla = Array.from(j.nombre).reduce((a, c) => (a * 31 + c.codePointAt(0)) >>> 0, 7);
    const span = document.createElement("span");
    span.className = "motivo";
    span.textContent = frases[semilla % frases.length];
    lista.lastChild.append(span);
  }

  // null mientras carga, false si no hay conexión.
  let datos = null;

  function pintar() {
    T = TEXTOS[idioma] || TEXTOS.es;
    document.documentElement.lang = idioma;
    document.title = T.titulo;
    document.querySelectorAll("[data-idioma]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.idioma === idioma)));
    $("titulo").textContent = T.titulo;
    $("intro").textContent = T.intro + " " + T.leyendaPistas;
    $("volver").textContent = T.volver;
    for (const id of ["ganadores", "sospechosos", "pendientes", "rendidos"]) $(id).replaceChildren();
    $("bloque-rendidos").hidden = true;
    $("bloque-sospechosos").hidden = true;
    $("titulo-pendientes").hidden = true;
    if (datos === null) { $("estado").textContent = T.cargando; return; }
    if (datos === false) { $("estado").textContent = T.sinNube; return; }
    const r = datos;
    const intentosDe = (j) => j.acertadoEn || j.intentos;
    const sospechosos = r.ganadores.filter((j) => intentosDe(j) <= MAX_SOSPECHOSO);
    const ganadores = r.ganadores.filter((j) => intentosDe(j) > MAX_SOSPECHOSO);
    $("estado").textContent = ganadores.length ? "" : T.nadie;
    // Empates: misma posición para las mismas pistas abiertas e intentos.
    let posicion = 0, anterior = null;
    ganadores.forEach((j, i) => {
      const n = intentosDe(j);
      const clave = `${j.pistasAbiertas || 0}-${n}`;
      if (clave !== anterior) { posicion = i + 1; anterior = clave; }
      fila($("ganadores"), posicion, j.nombre, n, null, j.pistasAbiertas || 0);
    });
    if (sospechosos.length) {
      $("bloque-sospechosos").hidden = false;
      $("titulo-sospechosos").textContent = T.sospechosos;
      $("intro-sospechosos").textContent = T.introSospechosos.replace("{max}", MAX_SOSPECHOSO);
      sospechosos.forEach((j) => {
        fila($("sospechosos"), null, j.nombre, intentosDe(j), "🕵️");
        motivo($("sospechosos"), j, T.motivos);
      });
    }
    // Quien lleva más de una hora sin intentarlo y sin acertar, ha tirado la toalla.
    const ahora = Date.now();
    const rendido = (j) => j.actualizado && j.actualizado.toMillis && ahora - j.actualizado.toMillis() > HORA_RENDIDO;
    const activos = r.pendientes.filter((j) => !rendido(j));
    const rendidos = r.pendientes.filter(rendido);
    if (activos.length) {
      $("titulo-pendientes").hidden = false;
      $("titulo-pendientes").textContent = T.pendientes;
      activos.forEach((j) => fila($("pendientes"), null, j.nombre, j.intentos, null, j.pistasAbiertas || 0));
    }
    if (rendidos.length) {
      $("bloque-rendidos").hidden = false;
      $("titulo-rendidos").textContent = T.rendidos;
      $("intro-rendidos").textContent = T.introRendidos;
      rendidos.forEach((j) => {
        fila($("rendidos"), null, j.nombre, j.intentos, "🏳️", j.pistasAbiertas || 0);
        motivo($("rendidos"), j, T.motivosRendidos);
      });
    }
  }

  document.querySelectorAll("[data-idioma]").forEach((b) => b.addEventListener("click", () => {
    idioma = b.dataset.idioma;
    try { localStorage.setItem("idioma", idioma); } catch (e) {}
    pintar();
  }));

  pintar();
  // Primero una lectura normal, que es lo más rápido para pintar algo.
  try {
    datos = (await almacen.obtenerRanking()) || false;
  } catch (e) {
    console.error(e);
    datos = false;
  }
  pintar();
  // Después, en tiempo real: se repinta en cuanto alguien juega, sin recargar.
  // Si la escucha no está disponible o falla, se consulta cada 30 segundos.
  let consultando = null;
  const consultarCada30s = () => {
    if (consultando) return;
    consultando = setInterval(async () => {
      try { const r = await almacen.obtenerRanking(); if (r) { datos = r; pintar(); } } catch (e) { console.warn(e); }
    }, 30000);
  };
  if (almacen.escucharRanking) {
    almacen.escucharRanking((r) => { datos = r; pintar(); }, (e) => { console.warn(e); consultarCada30s(); });
  } else {
    consultarCada30s();
  }
  // Quien deja de jugar pasa a "tiraron la toalla" con el tiempo, aunque nada cambie.
  setInterval(() => { if (datos) pintar(); }, 60000);
</script>
</body>
</html>
